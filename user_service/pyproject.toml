[project]
name = "user_service"
version = "0.1.0"
description = "Users, password login and refresh sessions"
requires-python = ">=3.12"
dependencies = [
    "shared>=0.1.0",
    "uvicorn[standard]>=0.30.0",
    "email-validator>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pwdlib[argon2]>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_service"]
