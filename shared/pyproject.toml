[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared"
version = "0.1.0"
description = "Common database, HTTP and authentication infrastructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "PyJWT[crypto]>=2.10.0",
]

[project.optional-dependencies]
messaging = ["aiokafka>=0.12.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
