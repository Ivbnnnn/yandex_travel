services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/setup_local.py}
      POSTGRES_DB: travel_mvp
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - monolith_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_mvp"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: yandex-travel-monolith:local
    environment:
      DATABASE_URL: postgresql+asyncpg://travel:${POSTGRES_PASSWORD}@postgres:5432/travel_mvp
      JWT_SECRET: ${JWT_SECRET:?Run tools/setup_local.py}
      CSRF_SECRET: ${CSRF_SECRET:?Run tools/setup_local.py}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run tools/setup_local.py}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SEED_DATA: ${SEED_DATA:-true}
      DEMO_PAYMENTS: ${DEMO_PAYMENTS:-true}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      ACCESS_TTL_SECONDS: ${ACCESS_TTL_SECONDS:-900}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-900}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  monolith_postgres_data:
