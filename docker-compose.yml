services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/setup_local.py first}
      POSTGRES_DB: user_service
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service"]
      interval: 3s
      timeout: 3s
      retries: 20

  user-migrate:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    image: yandex-travel-user-migrate:local
    command: ["alembic", "-c", "/app/user_service/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://user_service:${POSTGRES_PASSWORD}@postgres:5432/user_service
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  catalog-migrate:
    build:
      context: .
      dockerfile: catalog_service/Dockerfile
    image: yandex-travel-catalog-migrate:local
    command: ["alembic", "-c", "/app/catalog_service/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://catalog_service:${POSTGRES_PASSWORD}@postgres:5432/catalog_service
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  user-service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    image: yandex-travel-user:local
    environment:
      DATABASE_URL: postgresql+asyncpg://user_service:${POSTGRES_PASSWORD}@postgres:5432/user_service
      AUTH_PRIVATE_KEY_PATH: /run/keys/auth-private.pem
      AUTH_PUBLIC_KEY_PATH: /run/keys/auth-public.pem
      GATEWAY_PUBLIC_KEY_PATH: /run/keys/gateway-public.pem
      CSRF_SECRET: ${CSRF_SECRET:?Run tools/setup_local.py first}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ACCESS_TTL_SECONDS: ${ACCESS_TTL_SECONDS:-900}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    volumes:
      - ./.local/keys/auth-private.pem:/run/keys/auth-private.pem:ro
      - ./.local/keys/auth-public.pem:/run/keys/auth-public.pem:ro
      - ./.local/keys/gateway-public.pem:/run/keys/gateway-public.pem:ro
    expose:
      - "8001"
    depends_on:
      user-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: yandex-travel-gateway:local
    environment:
      AUTH_PUBLIC_KEY_PATH: /run/keys/auth-public.pem
      GATEWAY_PRIVATE_KEY_PATH: /run/keys/gateway-private.pem
      GATEWAY_PUBLIC_KEY_PATH: /run/keys/gateway-public.pem
      CSRF_SECRET: ${CSRF_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GATEWAY_USER_SERVICE_URL: http://user-service:8001
      GATEWAY_DOCUMENT_SERVICE_URL: http://document-service:8002
      GATEWAY_AI_SERVICE_URL: http://ai-service:8003
    volumes:
      - ./.local/keys/auth-public.pem:/run/keys/auth-public.pem:ro
      - ./.local/keys/gateway-private.pem:/run/keys/gateway-private.pem:ro
      - ./.local/keys/gateway-public.pem:/run/keys/gateway-public.pem:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional infrastructure for future events. Authentication does not use Kafka.
  kafka:
    image: apache/kafka:4.1.2
    profiles: ["messaging"]
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:29093,HOST://:9092,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  user_postgres_data:
  kafka_data:
