# Общие настройки инструментов. Зависимости и сборка каждого сервиса
# описываются в его собственном pyproject.toml.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["shared/src", "user_service/src", "gateway/src"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "contract: проверки совместимости HTTP API и событий",
    "integration: проверки взаимодействия с базой данных и Kafka",
    "e2e: сквозные пользовательские сценарии",
]
