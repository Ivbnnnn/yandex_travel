[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-mvp"
version = "0.1.0"
description = "Simple hotel search and booking monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2,<3",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2,<3",
  "email-validator>=2,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
